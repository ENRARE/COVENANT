[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../../lib"]
auto_detect_remappings = false
remappings = [
    "@openzeppelin/=../../lib/openzeppelin-contracts/",
    "forge-std/=../../lib/forge-std/src/",
]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true

[fmt]
line_length = 100
