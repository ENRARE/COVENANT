name: Repository security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  private-artifact-and-secret-checks:
    name: Private artifacts and secrets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository security checks
        run: pnpm security:check

      - name: Run security tests
        run: pnpm test:security
